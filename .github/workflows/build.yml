name: Build DroidLink IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidlink-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync source bundle
        env:
          SRC_URL: https://aka.doubaocdn.com/s/IDQV26vNjn
        run: |
          set -euo pipefail
          REV_FILE=.src-rev
          if [ -f project.yml ] && [ -f "$REV_FILE" ] && [ "$(cat "$REV_FILE")" = "$SRC_URL" ]; then
            echo "Sources up to date"
            exit 0
          fi
          curl -fsSL --max-time 120 -o /tmp/src.zip "$SRC_URL"
          unzip -oq /tmp/src.zip -d /tmp/src
          rsync -a --exclude '.github' /tmp/src/DroidLink-src/ ./
          echo "$SRC_URL" > "$REV_FILE"

      - name: Commit sources [skip ci]
        run: |
          git config user.name "droidlink-ci"
          git config user.email "ci@droidlink.local"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "src: sync DroidLink sources [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DroidLink.xcodeproj \
            -scheme DroidLink \
            -configuration Release \
            -archivePath build/DroidLink.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          APP="build/DroidLink.xcarchive/Products/Applications/DroidLink.app"
          test -d "$APP"
          chmod +x "$APP/DroidLink" || true
          mkdir -p build/Payload
          cp -a "$APP" build/Payload/
          cd build && zip -r -X DroidLink-unsigned.ipa Payload && ls -lh DroidLink-unsigned.ipa

      - name: Publish unsigned release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete droidlink-latest -y --cleanup-tag || true
          gh release create droidlink-latest \
            build/DroidLink-unsigned.ipa \
            --title "DroidLink 1.0.0 · unsigned IPA" \
            --prerelease \
            --notes "iPhone 端 scrcpy 客户端：连接宿主机上的 scrcpy-server，H.264 硬解显示，触控/返回/主页/多任务回传。需先在电脑上运行 host 脚本开启 27183/27184。未签名，需重签安装。"

      - name: Simulator smoke test
        continue-on-error: true
        run: |
          set -uo pipefail
          xcodebuild build -project DroidLink.xcodeproj -scheme DroidLink -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -30
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" /tmp/dd/Build/Products/Debug-iphonesimulator/DroidLink.app || true
          xcrun simctl launch "$UDID" com.haojunnong.droidlink || true
          sleep 8
          xcrun simctl io "$UDID" screenshot /tmp/sim-home.png || true

      - name: Publish CI artifacts
        if: always()
        run: |
          mkdir -p ci
          cp /tmp/sim-*.png ci/ 2>/dev/null || true
          git config user.name "droidlink-ci"
          git config user.email "ci@droidlink.local"
          git checkout -B ci-shots
          git add -f ci/sim-*.png 2>/dev/null || true
          git commit -m "ci: screenshot [skip ci]" || true
          git push -f origin ci-shots || true

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p ci
          grep -n "error:" build.log | head -n 80 > ci/errors.txt || true
          tail -n 200 build.log > ci/tail.txt || true
          git config user.name "droidlink-ci"
          git config user.email "ci@droidlink.local"
          git checkout -B ci-logs
          git add -f ci/errors.txt ci/tail.txt
          git commit -m "ci: failure log" || true
          git push -f origin ci-logs
