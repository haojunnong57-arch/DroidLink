name: Build DroidLink IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidlink-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync source bundle
        env:
          SRC_URL: https://aka.doubaocdn.com/s/i26yLTH6NG
        run: |
          set -euo pipefail
          REV_FILE=.src-rev
          if [ -f project.yml ] && [ -f "$REV_FILE" ] && [ "$(cat "$REV_FILE")" = "$SRC_URL" ]; then
            echo "Sources up to date"
            exit 0
          fi
          curl -fsSL --max-time 120 -o /tmp/src.zip "$SRC_URL"
          unzip -oq /tmp/src.zip -d /tmp/src
          rsync -a --exclude '.github' /tmp/src/DroidLink-src/ ./
          echo "$SRC_URL" > "$REV_FILE"

      - name: Commit sources [skip ci]
        run: |
          git config user.name "droidlink-ci"
          git config user.email "ci@droidlink.local"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "src: sync DroidLink sources [skip ci]"
            git push origin HEAD:main
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DroidLink.xcodeproj \
            -scheme DroidLink \
            -configuration Release \
            -archivePath build/DroidLink.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        if: success()
        run: |
          set -euo pipefail
          APP="build/DroidLink.xcarchive/Products/Applications/DroidLink.app"
          test -d "$APP"
          chmod +x "$APP/DroidLink" || true
          mkdir -p build/Payload
          cp -a "$APP" build/Payload/
          cd build && zip -r -X DroidLink-unsigned.ipa Payload && ls -lh DroidLink-unsigned.ipa

      - name: Publish unsigned release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete droidlink-latest -y --cleanup-tag || true
          gh release create droidlink-latest \
            build/DroidLink-unsigned.ipa \
            --title "DroidLink 1.0.1 · unsigned IPA" \
            --prerelease \
            --notes "修复：所有 AVSampleBufferDisplayLayer 操作改到主线程，避免后台队列 flush/enqueue 造成的卡死与黑屏。其余同 1.0.0。未签名，需重签安装。"

      - name: Publish CI artifacts
        if: always()
        run: |
          git config user.name "droidlink-ci"
          git config user.email "ci@droidlink.local"
          git checkout -B ci-logs
          if [ -f build.log ]; then
            grep -n "error:" build.log | head -n 80 > ci/errors.txt || true
            tail -n 200 build.log > ci/tail.txt || true
            git add -f ci/errors.txt ci/tail.txt
            git commit -m "ci: build log [skip ci]" || true
            git push -f origin ci-logs || true
          fi
